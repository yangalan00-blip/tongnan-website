         ========================== -->
    <section class="card">
        <div class="label">简介</div>
        <p>
            冬语（Tongnan）是一门人造语言。它的书写系统由字母和符号组成，详见<a href="/#alphabet">基础字母表</a>。
        </p>
        <p>
            目前在网站上展示的冬语字体是<strong>方体</strong>（TongSquare），其基于Unicode的拉丁字符区域，重新设计了字形。
            因此，你可以在<a href="/#transcriber">转写器</a>中输入<code>a-zA-Z</code>的普通拉丁字母尝试转写！
        </p>
        <p>
            转写窗口下方的按钮可以选择特殊字符，点击即可插入到转写文本中。
        </p>
        <p>
            更多冬语字体信息，请参考B站视频：<a href="https://www.bilibili.com/video/BV1CeYe6XEoc/?spm_id_from=333.1387.homepage.video_card.click&vd_source=027ae0cb6b5ef50771a06ebbff27b84c" target="_blank" rel="noopener">
                冬语字体设计</a>。
