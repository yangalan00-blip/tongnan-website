<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 — 页面不存在 | Tongnan</title>

    <link rel="stylesheet" href="/style.css">

    <style>
        .error-code {
            font-size: 96px;
            font-weight: bold;
            margin: 0;
            color: #c9c9c9;
            line-height: 1;
        }

        .error-title {
            font-family: "TongnanWeb", sans-serif;
            font-size: 40px;
            margin: 16px 0 8px;
        }
    </style>
</head>

<body>

<main class="container">

    <section class="card">

        <p class="error-code">404</p>

        <h1 class="error-title">tongnan</h1>

        <p class="subtitle">
            页面不存在 / Page not found.
        </p>

        <p class="description">
            该页面可能已被移动或删除。<br>
            The page you requested could not be found.
        </p>

        <p>
            <a href="/">← 返回首页 / Back to home</a>
        </p>

    </section>

</main>

</body>
</html>
