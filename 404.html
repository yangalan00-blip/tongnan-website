<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 — 页面不存在 | Tongnan</title>

    <!-- 浅色模式：深色图案 logo -->
    <link rel="icon" type="image/webp" href="/icon_tongnan_light_500px.webp" media="(prefers-color-scheme: light)">
    <!-- 深色模式：浅色图案 logo -->
    <link rel="icon" type="image/webp" href="/icon_tongnan_dark_500px.webp" media="(prefers-color-scheme: dark)">
    <link rel="apple-touch-icon" href="/icon_tongnan_light_500px.webp">

    <link rel="stylesheet" href="/style.css">

    <style>
        .error-code {
            font-size: 96px;
            font-weight: 800;
            margin: 0;
            color: var(--blue);
            opacity: 0.35;
            line-height: 1;
        }

        .error-title {
            font-family: "TongnanWeb", sans-serif;
            font-size: 40px;
            margin: 16px 0 8px;
        }
    </style>
</head>

<body>

<!-- 装饰性背景光斑 -->
<div class="bg-blobs" aria-hidden="true"></div>

<!-- 公共导航（由 /js/site.js 注入） -->
<div data-site-nav></div>

<main class="container">

    <section class="card">

        <p class="error-code">404</p>

        <h1 class="error-title">tongnan</h1>

        <p class="subtitle">
            页面不存在 / Page not found.
        </p>

        <p class="description">
            该页面可能已被移动或删除。<br>
            The page you requested could not be found.
        </p>

        <div class="hero-actions">
            <a class="btn btn--primary" href="/">← 返回首页</a>
            <a class="btn btn--ghost" href="/dictionary/">浏览词典</a>
        </div>

    </section>

</main>

<div data-site-footer></div>

<script src="/js/site.js"></script>
